# Teledyne FLIR Hadron 640R radiometric thermal channel.
# Model 70640AS32-6PMRXX. The Hadron also contains a visible-light camera;
# this configuration represents its IR channel only.
name: "FLIR Hadron 640R"
type: "ir_camera"
manufacturer: "Teledyne FLIR"
model_name: "Hadron 640R"
model_number: "70640AS32-6PMRXX"
detector_type: "Uncooled VOx microbolometer"
radiometric: true

detector:
  width: 640
  height: 512
  frame_rate_hz: 60.0
  pixel_pitch_um: 12.0
  ifov_mrad: 0.882
  spectral_band_um: [8.0, 14.0]
  netd_K: 0.040
  temperature_accuracy_K: 5.0
  temperature_range_K: [233.15, 413.15]
  gain_mode: "high"
  nuc_mode: "factory"

optics:
  camera_model: "pinhole"
  horizontal_fov_deg: 32.0
  vertical_fov_deg: 25.6
  focal_length_mm: 13.6
  f_number: 1.0
  digital_zoom: 1.0
  near: 0.1
  far: 12000.0

radiometry:
  emissivity: 0.95
  atmospheric_transmission: 1.0
  atmospheric_temperature_K: 293.15
  reflected_temperature_K: 293.15

output:
  input: "scene_temperature"
  output: "thermal_image"
  encode: "ir"
  palette: "ironbow"
  noise_seed: 6400

mount:
  mount_mode: "model_bounds"
  mount_position: [0.5, 1.02, 0.5]
  mount_hpr: [0.0, -20.0, 0.0]
  mass_g: 56.0
  power_consumption_W: 1.8

model_configs:
  model: ""
  position: [0.0, 0.0, 0.0]
  orientation: [0.0, 0.0, 0.0]
  color: [1.0, 1.0, 1.0]
  scale: 1.0
