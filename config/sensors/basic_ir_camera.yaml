# General-purpose long-wave infrared camera.
# Units: temperatures K, FOV degrees, wavelength um, pitch um, focal length mm.
name: "General IR Camera"
type: "ir_camera"
manufacturer: "Generic"
model_name: "Generic LWIR"
model_number: "generic-lwir"
detector_type: "Uncooled microbolometer"
radiometric: true

detector:
  width: 640
  height: 512
  frame_rate_hz: 30.0
  pixel_pitch_um: 12.0
  ifov_mrad: 1.304
  spectral_band_um: [8.0, 14.0]
  netd_K: 0.050
  temperature_accuracy_K: 5.0
  temperature_range_K: [233.15, 423.15]
  display_temperature_range_K: [260.0, 330.0]
  automatic_gain_control: true
  agc_min_span_K: 30.0
  gain_mode: "high"
  nuc_mode: "factory"

optics:
  camera_model: "pinhole"
  horizontal_fov_deg: 50.0
  vertical_fov_deg: 40.0
  focal_length_mm: 9.2
  f_number: 1.0
  digital_zoom: 1.0
  near: 0.1
  far: 1000.0

radiometry:
  emissivity: 0.95
  atmospheric_transmission: 1.0
  atmospheric_temperature_K: 293.15
  reflected_temperature_K: 293.15
  atmospheric_extinction_per_m: 0.00015
  surface_temperature_variation_K: 1.0
  solar_surface_gain_K: 6.0

output:
  input: "scene_temperature"
  output: "thermal_image"
  encode: "ir"
  palette: "ironbow"
  noise_seed: 0

mount:
  # Fractions of the owning model's X/Y/Z bounds. Y=1.02 places the optical
  # origin just beyond the front of the model and avoids rendering its body.
  mount_mode: "model_bounds"
  mount_position: [0.5, 1.02, 0.5]
  mount_hpr: [0.0, -20.0, 0.0]
  mass_g: 10.0
  power_consumption_W: 1.0

model_configs:
  model: ""
  position: [0.0, 0.0, 0.0]
  orientation: [0.0, 0.0, 0.0]
  color: [1.0, 1.0, 1.0]
  scale: 1.0
