# Teledyne FLIR Boson 640 radiometric, 50 degree HFOV, 9.2 mm lens.
# Model 20640AS50-6IARX. Manufacturer values are represented in SI-adjacent
# simulation units: K, degrees, um, mm, Hz.
name: "FLIR Boson 640"
type: "ir_camera"
manufacturer: "Teledyne FLIR"
model_name: "Boson 640 Radiometric"
model_number: "20640AS50-6IARX"
detector_type: "Uncooled VOx microbolometer"
radiometric: true

detector:
  width: 640
  height: 512
  frame_rate_hz: 60.0
  pixel_pitch_um: 12.0
  ifov_mrad: 1.304
  spectral_band_um: [8.0, 14.0]
  netd_K: 0.040
  temperature_accuracy_K: 5.0
  temperature_range_K: [233.15, 413.15]
  display_temperature_range_K: [260.0, 330.0]
  automatic_gain_control: true
  agc_min_span_K: 30.0
  gain_mode: "high"
  nuc_mode: "silent_shutterless"

optics:
  camera_model: "pinhole"
  horizontal_fov_deg: 50.0
  vertical_fov_deg: 40.0
  focal_length_mm: 9.2
  f_number: 1.0
  digital_zoom: 1.0
  near: 0.1
  far: 12000.0

radiometry:
  emissivity: 0.95
  atmospheric_transmission: 1.0
  atmospheric_temperature_K: 293.15
  reflected_temperature_K: 293.15
  atmospheric_extinction_per_m: 0.00015
  surface_temperature_variation_K: 1.0
  solar_surface_gain_K: 6.0

output:
  input: "scene_temperature"
  output: "thermal_image"
  encode: "ir"
  palette: "ironbow"
  noise_seed: 640

mount:
  mount_mode: "model_bounds"
  mount_position: [0.5, 1.02, 0.5]
  mount_hpr: [0.0, -20.0, 0.0]
  mass_g: 7.5
  power_consumption_W: 0.5

model_configs:
  model: ".\\assets\\Sensors\\SLR_Camera\\10124_SLR_Camera_SG_V1_Iteration2.obj"
  position: [0.0, 0.0, 0.0]
  orientation: [0.0, 0.0, 0.0]
  color: [1.0, 1.0, 1.0]
  scale: 0.1
