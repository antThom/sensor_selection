        - <<: *window
          type: window
          offset:
            reference: right
            margin: 1.5
          z: 1.0

      back_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

      left_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

      right_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

  2_story:

    colonial:

      width: 11.0
      depth: 9.0

      wall:
        height: 6.5
        thickness: 0.20
        texture: "assets\\textures\\building_materials\\bricks\\Bricks097_1K-JPG\\Bricks097_1K-JPG_Color.jpg"

      roof:
        type: gable
        roof_height: 2.0

      front_openings:

        - <<: *door
          type: door
          offset:
            reference: center
          z: 0.0

        - <<: *window
          type: window
          offset:
            reference: left
            margin: 2.0
          z: 1.0

        - <<: *window
          type: window
          offset:
            reference: right
            margin: 2.0
          z: 1.0

        - <<: *window
          type: window
          offset:
            reference: left
            margin: 2.0
          z: 4.2

        - <<: *window
          type: window
          offset:
            reference: right
            margin: 2.0
          z: 4.2

      back_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 4.2

      left_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 4.2

      right_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 4.2

    craftsman:

      width: 12.0
      depth: 10.0

      wall:
        height: 6.4
        thickness: 0.20
        texture: "assets\\textures\\building_materials\\siding\\wood\\wood_siding.png"

      roof:
        type: gable
        roof_height: 1.6

      front_openings:

        - <<: *door
          type: door
          offset:
            reference: left
            margin: 2.5
          z: 0.0

        - <<: *window
          type: window
          offset:
            reference: right
            margin: 2.0
          z: 1.2

        - <<: *window
          type: window
          offset:
            reference: left
            margin: 2.5
          z: 4.2

        - <<: *window
          type: window
          offset:
            reference: right
            margin: 2.0
          z: 4.2

      back_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 4.2

      left_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 4.2

      right_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 4.2

    modern:

      width: 12.0
      depth: 10.0

      wall:
        height: 6.5
        thickness: 0.20
        texture: "assets\\textures\\building_materials\\siding\\stucco\\white_stucco.png"
        left_wall_angle: "pi/2"
        right_wall_angle: "pi/2"
      roof:
        type: flat
        roof_height: 0.25

      front_openings:

        - <<: *door
          type: door
          offset:
            reference: left
            margin: 2.5
          z: 0.0

        - <<: *window
          type: window
          width: 3.0
          height: 2.0
          offset:
            reference: right
            margin: 2.0
          z: 1.0

        - <<: *window
          type: window
          width: 3.5
          height: 1.6
          offset:
            reference: center
          z: 4.5

      back_openings:
        - <<: *window
          type: window
          width: 3.0
          offset:
            reference: center
          z: 4.0

      left_openings: []

      right_openings: []

