defaults:

  window: &window
    width: 1.5
    height: 1.3
    thickness: 0.08
    texture: [100, 149, 237, 150]

  door: &door
    width: 1.0
    height: 2.2
    thickness: 0.10
    texture: "assets/textures/building_materials/door/wood_panel_door_glass.png"

################################################################################
# SINGLE FAMILY HOMES
################################################################################

single_family:

  1_story:
    ranch:
      width: 14.0
      depth: 10.0
      wall:
        height: 3.0
        thickness: 0.20
        texture: "assets\\textures\\building_materials\\siding\\wood\\white_vinyl.png"
        # right_wall_angle: "pi/2"
      roof:
        type: hip
        roof_height: 1.2
      front_openings:
        - <<: *door
          type: door
          offset:
            reference: left
            margin: 2.0
          z: 0.0

        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

        - <<: *window
          type: window
          offset:
            reference: right
            margin: 2.0
          z: 1.0

      back_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

      left_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

      right_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

    bungalow:
      width: 9.0
      depth: 8.0
      wall:
        height: 3.2
        thickness: 0.20
        texture: "assets\\textures\\building_materials\\bricks\\Bricks101_1K-JPG\\Bricks101_1K-JPG_Color.jpg"
      roof:
        type: gable
        roof_height: 2.3

      front_openings:

        - <<: *door
          type: door
          offset:
            reference: left
            margin: 2.0
          z: 0.0

        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

        - <<: *window
          type: window
          offset:
            reference: right
            margin: 1.5
          z: 1.0

      back_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

      left_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

      right_openings:
        - <<: *window
          type: window
          offset:
            reference: center
          z: 1.0

    cottage:
      width: 8.0
      depth: 7.0
      wall:
        height: 2.8
        thickness: 0.20
        texture: "assets\\textures\\building_materials\\siding\\wood\\white_painted_siding.png"
      roof:
        type: gable
        roof_height: 2.5

      front_openings:

        - <<: *door
          type: door
          offset:
            reference: center
          z: 0.0

        - <<: *window
